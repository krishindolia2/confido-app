name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          flutter create . --platforms android
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          cat <<EOF > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
                  maven { url = uri("https://repo1.maven.org/maven2/") }
              }
              configurations.all {
                  resolutionStrategy.eachDependency {
                      if (requested.group == "com.czt.mp3recorder") {
                          useVersion("1.0.4")
                      }
                  }
              }
          }
          EOF

          cat <<EOF > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.example.confido"
              compileSdk = 35
              ndkVersion = "28.2.13676358"
              defaultConfig {
                  applicationId = "com.example.confido"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          flutter {
              source = "../.."
          }
          dependencies {
              implementation("com.czt.mp3recorder:library:1.0.4") {
                  isTransitive = false
              }
          }
          EOF

          # Final patch for the record_mp3 package namespace
          sed -i 's/android {/android {\n    namespace "com.example.confido"/' /home/runner/.pub-cache/hosted/pub.dev/record_mp3-3.0.0/android/build.gradle
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
