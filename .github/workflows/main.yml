name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          flutter create . --platforms android --org com.example
          rm -f android/*.kts android/app/*.kts
          
          # Create settings.gradle so 'app' is recognized
          echo "include ':app'" > android/settings.gradle
          
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Root Build File
          cat <<EOF > android/build.gradle
          buildscript {
              repositories { google(); mavenCentral(); maven { url 'https://maven.aliyun.com/repository/jcenter' } }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral(); maven { url 'https://maven.aliyun.com/repository/jcenter' }; maven { url 'https://jitpack.io' } }
          }
          EOF

          # App Build File
          cat <<EOF > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.example.confido"
              compileSdkVersion 35
              ndkVersion "26.2.13676358"
              defaultConfig {
                  applicationId "com.example.confido"
                  minSdkVersion 21
                  targetSdkVersion 35
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility 17; targetCompatibility 17 }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          # Patch plugin
          REC_DIR=$(find $HOME/.pub-cache -name "record_mp3-3.0.0" -type d | head -n 1)
          if [ -n "$REC_DIR" ]; then
            sed -i 's|import io.flutter.plugin.common.PluginRegistry.Registrar;||g' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            sed -i '/public static void registerWith(Registrar registrar) {/,/}/d' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            sed -i 's|package="com.plugin.record_mp3"||g' "$REC_DIR/android/src/main/AndroidManifest.xml"
            sed -i 's|repositories {|repositories {\n        maven { url "https://maven.aliyun.com/repository/jcenter" }|' "$REC_DIR/android/build.gradle"
            sed -i 's|android {|android {\n    namespace "com.plugin.record_mp3"|' "$REC_DIR/android/build.gradle"
            sed -i 's|compileSdkVersion.*|compileSdkVersion 35|' "$REC_DIR/android/build.gradle"
          fi
      
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
