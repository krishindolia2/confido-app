name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          flutter create . --platforms android
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
          
          cat <<EOF > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.aliyun.com/repository/jcenter") }
                  maven { url = uri("https://jitpack.io") }
              }
          }
          EOF

          cat <<EOF > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.example.confido"
              compileSdk = 34
              ndkVersion = "28.2.13676358"
              defaultConfig {
                  applicationId = "com.example.confido"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          flutter {
              source = "../.."
          }
          EOF

          # This is the "Magic Fix" for the record_mp3 code error
          # It comments out the old Registrar lines that are causing the 'cannot find symbol' error
          RECORD_MP3_PATH="/home/runner/.pub-cache/hosted/pub.dev/record_mp3-3.0.0/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
          sed -i 's/import io.flutter.plugin.common.PluginRegistry.Registrar;/\/\/ Registrar removed/g' $RECORD_MP3_PATH
          sed -i 's/public static void registerWith(Registrar registrar) {/\/* Registrar removed/g' $RECORD_MP3_PATH
          sed -i '/RecordMp3Plugin plugin = new RecordMp3Plugin();/a \    }' $RECORD_MP3_PATH
          sed -i 's/RecordMp3Plugin plugin = new RecordMp3Plugin();/RecordMp3Plugin plugin = new RecordMp3Plugin(); \n    }\n    \/*/g' $RECORD_MP3_PATH

          # Re-apply the namespace patch
          sed -i 's/android {/android {\n    namespace "com.example.confido"/' /home/runner/.pub-cache/hosted/pub.dev/record_mp3-3.0.0/android/build.gradle
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
