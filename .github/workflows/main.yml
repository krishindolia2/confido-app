name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          flutter create . --platforms android
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
          
          cat <<EOF > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.aliyun.com/repository/jcenter") }
                  maven { url = uri("https://jitpack.io") }
              }
              configurations.all {
                  resolutionStrategy {
                      force("androidx.core:core:1.13.1")
                      force("androidx.core:core-ktx:1.13.1")
                  }
              }
          }
          EOF

          cat <<EOF > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.example.confido"
              compileSdk = 35
              ndkVersion = "28.2.13676358"
              defaultConfig {
                  applicationId = "com.example.confido"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          flutter {
              source = "../.."
          }
          EOF

          # AUTOMATIC SEARCH AND PATCH
          # This finds the record_mp3 folder wherever it is in the cache
          REC_DIR=$(find $HOME/.pub-cache -name "record_mp3-3.0.0" -type d | head -n 1)

          if [ -n "$REC_DIR" ]; then
            echo "Found record_mp3 at $REC_DIR. Applying patches..."
            
            # 1. Fix Java Code
            sed -i 's/import io.flutter.plugin.common.PluginRegistry.Registrar;//g' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            sed -i '/public static void registerWith(Registrar registrar) {/,/}/d' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            
            # 2. Fix Manifest
            sed -i 's/package="com.plugin.record_mp3"//g' "$REC_DIR/android/src/main/AndroidManifest.xml"
            
            # 3. Fix Namespace
            sed -i 's/android {/android {\n    namespace "com.example.confido"/' "$REC_DIR/android/build.gradle"
          else
            echo "Error: Could not find record_mp3 in cache. Ensure 'Get dependencies' step finished."
            exit 1
          fi
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
