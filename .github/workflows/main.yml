name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          # 1. Project Setup
          flutter create . --platforms android --org com.example
          flutter pub get

          # 2. Android Environment Fixes
          echo "org.gradle.jvmargs=-Xmx2G" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Fix modern AndroidX dependency clash
          [[ -f "android/app/build.gradle" ]] && sed -i '/dependencies {/a \    configurations.all { resolutionStrategy.force "androidx.core:core:1.13.1" }' android/app/build.gradle
          [[ -f "android/app/build.gradle.kts" ]] && sed -i '/dependencies {/a \    configurations.all { resolutionStrategy { force("androidx.core:core:1.13.1") } }' android/app/build.gradle.kts

          # 3. The "Master Patch" for record_mp3
          REC_DIR=$(find $HOME/.pub-cache -name "record_mp3-3.0.0" -type d | head -n 1)
          if [ -n "$REC_DIR" ]; then
            echo "Performing total source override at $REC_DIR"
            
            # Delete the broken 'util' references and force all Java files into the same package
            find "$REC_DIR/android/src/main/java" -name "*.java" -exec sed -i 's|package com.czt.mp3recorder.util;|package com.plugin.record_mp3;|g' {} +
            find "$REC_DIR/android/src/main/java" -name "*.java" -exec sed -i 's|import com.czt.mp3recorder.util.||g' {} +
            find "$REC_DIR/android/src/main/java" -name "*.java" -exec sed -i 's|package com.plugin.record_mp3.record;|package com.plugin.record_mp3;|g' {} +
            
            # Remove legacy registrar
            sed -i 's|import io.flutter.plugin.common.PluginRegistry.Registrar;||g' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            sed -i '/public static void registerWith(Registrar registrar) {/,/}/d' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            
            # Recreate the build file
            echo "group 'com.plugin.record_mp3'" > "$REC_DIR/android/build.gradle"
            echo "apply plugin: 'com.android.library'" >> "$REC_DIR/android/build.gradle"
            echo "android { namespace 'com.plugin.record_mp3'; compileSdkVersion 35; defaultConfig { minSdkVersion 21 } }" >> "$REC_DIR/android/build.gradle"
            echo "repositories { google(); mavenCentral(); maven { url 'https://maven.aliyun.com/repository/jcenter' } }" >> "$REC_DIR/android/build.gradle"
          fi
      
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
