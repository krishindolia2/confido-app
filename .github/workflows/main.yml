name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          # 1. Setup project
          flutter create . --platforms android --org com.example
          flutter pub get

          # 2. Modernize the app settings (Single lines to avoid EOF)
          echo "org.gradle.jvmargs=-Xmx2G" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Fix Duplicate Class conflict
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/dependencies {/a \    configurations.all { resolutionStrategy.force "androidx.core:core:1.13.1" }' android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/dependencies {/a \    configurations.all { resolutionStrategy { force("androidx.core:core:1.13.1") } }' android/app/build.gradle.kts
          fi

          # 3. Deep-Patch the record_mp3 plugin source
          REC_DIR=$(find $HOME/.pub-cache -name "record_mp3-3.0.0" -type d | head -n 1)
          if [ -n "$REC_DIR" ]; then
            echo "Deep patching plugin at $REC_DIR..."
            
            # This replaces ALL instances of the broken package name with the correct one
            # It targets the specific 'cannot find symbol' errors in your screenshot
            find "$REC_DIR/android/src/main/java" -name "*.java" -exec sed -i 's|com.czt.mp3recorder.util|com.plugin.record_mp3|g' {} +
            
            # Remove legacy Java registrar that causes build crashes
            sed -i 's|import io.flutter.plugin.common.PluginRegistry.Registrar;||g' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            sed -i '/public static void registerWith(Registrar registrar) {/,/}/d' "$REC_DIR/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
            
            # Rebuild the plugin's build file line-by-line
            echo "group 'com.plugin.record_mp3'" > "$REC_DIR/android/build.gradle"
            echo "version '1.0-SNAPSHOT'" >> "$REC_DIR/android/build.gradle"
            echo "apply plugin: 'com.android.library'" >> "$REC_DIR/android/build.gradle"
            echo "repositories { google(); mavenCentral(); maven { url 'https://maven.aliyun.com/repository/jcenter' } }" >> "$REC_DIR/android/build.gradle"
            echo "android { namespace 'com.plugin.record_mp3'; compileSdkVersion 35; defaultConfig { minSdkVersion 21 } }" >> "$REC_DIR/android/build.gradle"
          fi
      
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
