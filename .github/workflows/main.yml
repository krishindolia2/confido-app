name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get
      - name: Create Android files
        run: |
          flutter create . --platforms android
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
          
          cat <<EOF > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.aliyun.com/repository/jcenter") }
                  maven { url = uri("https://jitpack.io") }
              }
              # This forces all libraries to use a version of core that has 'lStar'
              configurations.all {
                  resolutionStrategy {
                      force("androidx.core:core:1.13.1")
                      force("androidx.core:core-ktx:1.13.1")
                  }
              }
          }
          EOF

          cat <<EOF > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.example.confido"
              compileSdk = 35
              ndkVersion = "28.2.13676358"
              defaultConfig {
                  applicationId = "com.example.confido"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          flutter {
              source = "../.."
          }
          EOF

          # PATH VARIABLES
          REC_PATH="/home/runner/.pub-cache/hosted/pub.dev/record_mp3-3.0.0"
          JAVA_FILE="$REC_PATH/android/src/main/java/com/plugin/record_mp3/RecordMp3Plugin.java"
          MANIFEST_FILE="$REC_PATH/android/src/main/AndroidManifest.xml"
          GRADLE_FILE="$REC_PATH/android/build.gradle"

          # 1. FIX THE JAVA CODE
          sed -i 's/import io.flutter.plugin.common.PluginRegistry.Registrar;//g' $JAVA_FILE
          sed -i '/public static void registerWith(Registrar registrar) {/,/}/d' $JAVA_FILE

          # 2. FIX THE MANIFEST
          sed -i 's/package="com.plugin.record_mp3"//g' $MANIFEST_FILE

          # 3. FIX THE PACKAGE NAMESPACE
          sed -i 's/android {/android {\n    namespace "com.example.confido"/' $GRADLE_FILE
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
